name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "lib/core[test]" -e "lib/mcp[test]" -e "lib/studio[test]" -e "lib/cryptomath[test,plot]" -e "lib/bench[test]" pymupdf
      - name: All checks (tests, self-tests, case-study gates)
        run: scripts/check_all.sh
