name: release
# Builds the single-file CRA Studio executable (Studio GUI + cra MCP server + cra CLI + cra-agent)
# for Windows, macOS and Linux. Runs on version tags (v*) and on demand; tags publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: CRA-Studio-windows-x64.exe
            built: dist/CRA-Studio.exe
          - os: macos-latest
            asset: CRA-Studio-macos-arm64
            built: dist/CRA-Studio
          - os: ubuntu-22.04
            asset: CRA-Studio-linux-x64
            built: dist/CRA-Studio
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e lib/core -e lib/bench -e lib/mcp -e lib/studio "pyinstaller>=6"
      - name: Build
        run: pyinstaller packaging/cra-studio.spec --noconfirm
      - name: Smoke test the executable
        shell: bash
        run: |
          EXE="${{ matrix.built }}"
          "$EXE" cra init smoke-proj
          "$EXE" doctor --project smoke-proj
          "$EXE" mcp --project smoke-proj --list-tools > tools.json
          python -c "import json; t=json.load(open('tools.json')); assert len(t)==15, len(t); print(len(t), 'tools')"
      - name: Rename
        shell: bash
        run: mv "${{ matrix.built }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
