[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crbench"
version = "0.1.0"
description = "Benchmark harness for cryptography research: interleaved A/B runs, robust statistics, environment capture, log parsers, tables and an evidence ledger."
requires-python = ">=3.10"
dependencies = ["numpy"]
license = {text = "MIT"}

[project.scripts]
crbench = "crbench.cli:main"

[tool.setuptools]
packages = ["crbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
